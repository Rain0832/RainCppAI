name: CI Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            make \
            ccache \
            libcurl4-openssl-dev \
            libssl-dev \
            libspdlog-dev \
            libopencv-dev \
            libmysqlcppconn-dev \
            libmysqlclient-dev \
            libsodium-dev \
            nlohmann-json3-dev \
            libhiredis-dev \
            libev-dev \
            libamqp-cpp-dev \
            clang-format

      - name: Install muduo
        run: |
          git clone --depth=1 https://github.com/chenshuo/muduo.git /tmp/muduo
          cd /tmp/muduo
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DMUDUO_BUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install

      - name: Install ONNX Runtime
        run: |
          curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-linux-x64-1.17.1.tgz | tar xz -C /tmp
          sudo mkdir -p /usr/local/onnxruntime
          sudo cp -r /tmp/onnxruntime-linux-x64-1.17.1/include /usr/local/onnxruntime/
          sudo cp -r /tmp/onnxruntime-linux-x64-1.17.1/lib /usr/local/onnxruntime/
          echo "/usr/local/onnxruntime/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig

      - name: ccache stats (before)
        run: ccache -s || true

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: ccache stats (after)
        run: ccache -s

      - name: Check formatting (hard check)
        run: |
          cd build
          make format
          if ! git diff --exit-code -- '*.cpp' '*.h'; then
            echo "::error::Some files are not formatted with clang-format."
            echo "Run 'make format' locally and commit the changes."
            exit 1
          fi
