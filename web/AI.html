<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Rain — Healthcare AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%232196f3'/><text x='50' y='72' text-anchor='middle' font-size='60' font-weight='800' fill='white'>+</text><circle cx='50' cy='50' r='18' fill='%23ff4081'/><text x='50' y='58' text-anchor='middle' font-size='22' fill='white'>♥</text></svg>">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.0/dist/purify.min.js"></script>
</head>

<body>
    <div class="toast" id="toast"></div>

    <!-- Profile Modal -->
    <div class="modal-overlay" id="profileModal" style="display:none">
        <div class="modal">
            <div class="modal-header"><h2>👤 个人中心</h2><button class="modal-close" id="profileClose">✕</button></div>
            <div class="profile-info">
                <div class="profile-row"><span class="profile-label">用户名</span><span class="profile-value" id="profileUsername">—</span></div>
                <div class="profile-row"><span class="profile-label">邮箱</span><span class="profile-value" id="profileEmail">—</span></div>
                <div class="profile-row"><span class="profile-label">角色</span><span class="profile-value" id="profileRole">—</span></div>
            </div>
            <div class="profile-actions">
                <button class="btn" id="profileFeedbackBtn">💬 意见反馈</button>
                <button class="btn btn-danger" id="profileLogoutBtn">🚪 退出登录</button>
            </div>
        </div>
    </div>

    <!-- Feedback Modal -->
    <div class="modal-overlay" id="feedbackModal" style="display:none">
        <div class="modal">
            <div class="modal-header"><h2>💬 意见反馈</h2><button class="modal-close" id="feedbackClose">✕</button></div>
            <textarea id="feedbackContent" maxlength="2000" placeholder="请描述你的建议或遇到的问题..."></textarea>
            <div style="text-align:right;margin-top:12px"><button class="btn btn-primary" id="feedbackSubmit">提交反馈</button></div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>会话列表</h2>
            <button class="new-chat-btn" id="newChatBtn">+ 新建对话</button>
        </div>
        <div class="session-list" id="sessionList"></div>
    </div>
    <div class="main">
        <div class="topbar">
            <h2 class="brand">Dr.Rain</h2>
            <div class="topbar-right">
                <button class="upload-btn" id="uploadBtn" title="图像识别">🖼️</button>
                <button class="theme-btn" id="themeToggle">☀️</button>
                <button class="avatar-btn" id="avatarBtn">👤</button>
            </div>
        </div>
        <div class="chat-area" id="chatArea">
        </div>
        <div class="disclaimer-bar">
            <span class="disclaimer-icon">&#9888;&#65039;</span>
            免责声明：Dr.Rain 提供的内容仅供参考，不构成医疗诊断、治疗建议或处方。如有健康问题，请及时咨询专业医生。紧急情况请拨打 120。
        </div>
        <form class="input-area" id="chatForm" style="display:none">
            <div class="input-top-row">
                <select id="modelType">
                </select>
            </div>
            <!-- Image preview -->
            <div class="img-preview" id="imgPreview" style="display:none">
                <img id="imgPreviewThumb" src="" alt="预览">
                <button type="button" class="img-clear-btn" id="imgClearBtn">✕</button>
            </div>
            <div class="input-bottom-row">
                <input type="file" id="imageInput" accept="image/*" style="display:none">
                <button type="button" class="attach-btn" id="attachBtn" title="上传图片">📎</button>
                <textarea id="question" placeholder="输入消息..." rows="1"></textarea>
                <button type="submit" class="send-btn" id="sendBtn">发送</button>
            </div>
        </form>
    </div>
    <script type="module" src="/js/ui.js"></script>
</body>

</html>
