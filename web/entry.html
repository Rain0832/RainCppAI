<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Rain — 登录</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%232196f3'/><text x='50' y='72' text-anchor='middle' font-size='60' font-weight='800' fill='white'>+</text><circle cx='50' cy='50' r='18' fill='%23ff4081'/><text x='50' y='58' text-anchor='middle' font-size='22' fill='white'>♥</text></svg>">
    <link rel="stylesheet" href="/css/entry.css">
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="切换主题">☀️</button>
    <div class="toast" id="toast"></div>
    <div class="wrapper">
        <div class="logo">
            <h1>Dr.Rain</h1>
            <p>智能医疗助手平台</p>
        </div>
        <div class="card">
            <div class="tabs">
                <button class="tab active" data-tab="login">登录</button>
                <button class="tab" data-tab="register">注册</button>
            </div>
            <div class="form-panel active" id="panel-login">
                <form id="login-form">
                    <div class="form-group"><label>用户名</label>
                        <input type="text" id="login-username" placeholder="请输入用户名" required autocomplete="username">
                    </div>
                    <div class="form-group"><label>密码</label>
                        <input type="password" id="login-password" placeholder="请输入密码" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn">登录</button>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/entry.js"></script>
</body>
</html>
