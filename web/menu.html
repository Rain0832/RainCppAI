<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Rain — 主页</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%232196f3'/><text x='50' y='72' text-anchor='middle' font-size='60' font-weight='800' fill='white'>+</text><circle cx='50' cy='50' r='18' fill='%23ff4081'/><text x='50' y='58' text-anchor='middle' font-size='22' fill='white'>♥</text></svg>">
    <link rel="stylesheet" href="/css/menu.css">
</head>

<body>
    <button class="theme-toggle" id="themeToggle">☀️</button>
    <div class="toast" id="toast"></div>
    <div class="header">
        <h1>Dr.Rain</h1>
        <p>选择一个服务开始使用</p>
    </div>
    <div class="grid">
        <div class="card" onclick="location.href='/chat'">
            <div class="card-icon chat">💬</div>
            <h3>AI 聊天助手</h3>
            <p>多模型对话，多会话管理，MCP 工具调用</p><span class="arrow">→</span>
        </div>
        <div class="card" id="profile-btn" onclick="showToast('模型服务由系统统一管理')">
            <div class="card-icon profile">⚙️</div>
            <h3>个人中心</h3>
            <p>API Key 管理、使用说明与账户设置</p><span class="arrow">→</span>
        </div>
        <div class="card" id="admin-btn" style="display:none">
            <div class="card-icon admin">🛡️</div>
            <h3>管理后台</h3>
            <p>实时看板、用户管理、日志查看</p><span class="arrow">→</span>
        </div>
        <div class="card danger" id="logout">
            <div class="card-icon logout">🚪</div>
            <h3>退出登录</h3>
            <p>安全退出当前账户</p><span class="arrow">→</span>
        </div>
    </div>

    <script src="/js/menu.js"></script>
</body>

</html>
