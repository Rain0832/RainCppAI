# =============================================================================
# Dr.Rain Nginx Reverse Proxy Configuration
# =============================================================================
# Usage:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/raincppai
#   sudo ln -s /etc/nginx/sites-available/raincppai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream raincppai_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

# HTTP → HTTPS Redirect (uncomment to enable)
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;
    server_name localhost;

    # SSL certificates (uncomment for HTTPS)
    # ssl_certificate     /etc/ssl/certs/raincppai.crt;
    # ssl_certificate_key /etc/ssl/private/raincppai.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/raincppai-access.log;
    error_log  /var/log/nginx/raincppai-error.log;

    # Static assets (cached)
    location /web/ {
        root /opt/raincppai;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Static assets alt path
    location /css/ {
        root /opt/raincppai/web;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /js/ {
        root /opt/raincppai/web;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # Main application proxy
    # CRITICAL for SSE: proxy_buffering MUST be off
    # =========================================================================
    location / {
        proxy_pass http://raincppai_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE critical — MUST be off for streaming
        proxy_buffering off;
        proxy_cache off;

        # Long timeout for SSE connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Max body size (image upload)
        client_max_body_size 20m;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
